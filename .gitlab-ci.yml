image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - test
  - package

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

variables:
  MAVEN_OPTS: >-
    -Dmaven.repo.local=.m2/repository
    -Djava.awt.headless=true
    -Dtestfx.robot=glass
    -Dtestfx.headless=true
    -Dprism.order=sw
    -Dprism.verbose=true

# ── BUILD ────────────────────────────────────────────────────────────────────

build:compile:
  stage: build
  script:
    - mvn clean compile -B
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ── TEST ─────────────────────────────────────────────────────────────────────

test:unit:
  stage: test
  script:
    - mvn test -B
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# ── PACKAGE ──────────────────────────────────────────────────────────────────

package:jar:
  stage: package
  script:
    - mvn package -DskipTests -B
  artifacts:
    paths:
      - target/*.jar
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
